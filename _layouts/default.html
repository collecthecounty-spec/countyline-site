<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.url == '/' or page.title == nil %}CountyLine.LA{% else %}{{ page.title }} — CountyLine.LA{% endif %}</title>
{% if page.excerpt %}<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header>
  <a class="logo" href="{{ '/' | relative_url }}" aria-label="CountyLine.LA home">County<span>Line</span>.LA</a>
  <nav>
    <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
    <a href="{{ '/articles/' | relative_url }}" class="{% if page.url contains '/articles' %}active{% endif %}">Articles</a>
    <a href="{{ '/archives/' | relative_url }}" class="{% if page.url contains '/archives' %}active{% endif %}">Archives</a>
    <a href="{{ '/projects/' | relative_url }}" class="{% if page.url contains '/projects' %}active{% endif %}">Projects</a>
    <a href="{{ '/products/' | relative_url }}" class="{% if page.url contains '/products' %}active{% endif %}">Products</a>
    <a href="{{ '/about/' | relative_url }}" class="{% if page.url == '/about/' %}active{% endif %}">About</a>
    <a href="{{ '/contact/' | relative_url }}" class="{% if page.url == '/contact/' %}active{% endif %}">Contact</a>
  </nav>
</header>

<main class="page-fade">
{{ content }}
</main>

<footer>
  <div class="footer-top">
    <span>CountyLine.LA</span>
    <span>Talking about cool stuff.</span>
  </div>
  <div class="footer-legal">
    <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
    <span class="dot">·</span>
    <a href="{{ '/terms/' | relative_url }}">Terms of Service</a>
  </div>
</footer>

</body>
</html>
